name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pi-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s pi/tests -v

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Collect files
        run: |
          cp app/build/outputs/apk/release/app-release.apk PiTouch.apk
          tar czf pitouch-pi.tar.gz --exclude=pi/tests pi
      - uses: actions/upload-artifact@v4
        with:
          name: PiTouch
          path: |
            PiTouch.apk
            pitouch-pi.tar.gz
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest PiTouch.apk pitouch-pi.tar.gz \
            --target "$GITHUB_SHA" --prerelease \
            --title "PiTouch (сборка ${GITHUB_RUN_NUMBER})" \
            --notes "Автосборка из ветки ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}. Установите PiTouch.apk на телефон."
